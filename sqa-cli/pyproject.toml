[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqa-cli"
version = "0.5.0"
description = "SQA CLI"
readme = "README.md"
authors = [
    { name = "Shawn Oster", email = "shawn.oster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["sqa-api"]

[project.scripts]
sqa = "sqa_cli:cli.main"

[tool.uv.sources]
sqa-api = { workspace = true }

[tool.semantic_release]
build_command = "pip install uv && uv build"
commit_message = "chore(sqa-cli-release): release sqa-cli@{version} [skip ci]"
commit_parser = "../scripts/psr/custom_parser/monorepo_parser.py:ConventionalCommitMonorepoParser"
tag_format = "sqa-cli-v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sqa_cli/__init__.py:__version__"]

# Branch settings: define which branches do releases
[semantic_release.branches.main]
match = "main"
