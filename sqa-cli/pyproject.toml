[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqa-cli"
version = "0.1.2"
description = "SQA CLI"
readme = "README.md"
authors = [
    { name = "Shawn Oster", email = "shawn.oster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["sqa-api"]

[project.scripts]
sqa = "sqa_cli:cli.main"

[tool.uv.sources]
sqa-api = { workspace = true }

[tool.semantic_release]
# Command to build the package (using uv for consistency)
build_command = "pip install uv && uv build"

# Git tag format for this package (ensures independent tags)
tag_format = "sqa-cli-v{version}"

# Locations of the version string to update
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sqa_cli/__init__.py:__version__"]

# Customize the commit message that PSR uses when it commits the bump
commit_message = "chore(sqa-cli-release): release sqa-cli@{version} [skip ci]"
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]

# Only consider commits that affect this package's path (monorepo filtering)
[tool.semantic_release.commit_parser_options]
path_filters = ["sqa-cli/*"]

# Branch settings: define which branches do releases
[semantic_release.branches.main]
match = "main"
