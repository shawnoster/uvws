version = 1
revision = 1
requires-python = ">=3.12"

[manifest]
members = [
    "plugin-one",
    "sqa",
    "sqa-api",
    "sqa-cli",
]

[[package]]
name = "plugin-one"
version = "0.5.0"
source = { editable = "plugins/plugin-one" }
dependencies = [
    { name = "sqa-api" },
]

[package.metadata]
requires-dist = [{ name = "sqa-api", editable = "sqa-api" }]

[[package]]
name = "sqa"
version = "2.0.2"
source = { editable = "." }

[[package]]
name = "sqa-api"
version = "0.4.8"
source = { editable = "sqa-api" }

[package.metadata]

[package.metadata.requires-dev]
dev = []

[[package]]
name = "sqa-cli"
version = "0.5.0"
source = { editable = "sqa-cli" }
dependencies = [
    { name = "sqa-api" },
]

[package.metadata]
requires-dist = [{ name = "sqa-api", editable = "sqa-api" }]
