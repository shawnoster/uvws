name: Release Packages
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write    # allow pushing tags and creating releases    

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history for accurate version calculations

  release-sqa-api:
    uses: ./.github/workflows/release-package.yml
    with:
      package: sqa-api
    secrets:
      github_release_token: ${{ secrets.GITHUB_TOKEN }}

  release-sqa-cli:
    uses: ./.github/workflows/release-package.yml
    with:
      package: sqa-cli
    secrets:
      github_release_token: ${{ secrets.GITHUB_TOKEN }}

  release-plugin-one:
    uses: ./.github/workflows/release-package.yml
    with:
      package: plugins/plugin-one
    secrets:
      github_release_token: ${{ secrets.GITHUB_TOKEN }}
