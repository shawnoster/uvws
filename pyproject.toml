[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqa-cli"]

[project]
name = "sqa"
version = "2.0.2"
description = "SQA CLI and plugins"
requires-python = ">=3.12"
authors = [
    { name = "Shawn Oster", email = "shawn.oster@gmail.com" }
]

[tool.uv.workspace]
members = [
    "plugins/*", 
    "sqa-api", 
    "sqa-cli"
]
