[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqa-cli"]

[project]
name = "sqa"
requires-python = ">=3.12"
authors = [
    { name = "Shawn Oster", email = "shawn.oster@gmail.com" }
]

[tool.uv.workspace]
exclude = ["plugins/cookiecutter-sqa-plugin"]
members = ["plugins/*", "sqa-api", "sqa-cli"]
