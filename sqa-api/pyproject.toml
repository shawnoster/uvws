[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqa-api"
version = "0.2.0"
description = "Shared plugin interface for SQA CLI and plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = []

[tool.semantic_release]
# Assumes uv is already installed in the environment
build_command = "uv build"

# Git tag format for this package (ensures independent tags)
tag_format = "sqa-api-v{version}"

# Locations of the version string to update
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sqa_api/__init__.py:__version__"]
commit_message = "chore(sqa-api-release): release sqa-api@{version} [skip ci]"
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]

# Only consider commits that affect this package's path (monorepo filtering)
[tool.semantic_release.commit_parser_options]
path_filters = ["sqa-api/*"]

# Branch settings: define which branches do releases
[semantic_release.branches.main]
match = "main"
