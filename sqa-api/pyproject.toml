[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqa-api"
version = "2.0.2"
description = "Shared plugin interface for SQA CLI and plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = []

[tool.semantic_release]
# Command to build the package (using uv for consistency)
build_command = "pip install uv && uv build"

# Git tag format for this package (ensures independent tags)
tag_format = "sqa-api-v{version}"

# Locations of the version string to update
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sqa_api/__init__.py:__version__"]

# Customize the commit message that PSR uses when it commits the bump
commit_message = """\
chore(sqa-api-release): release sqa-api@{version} [skip ci]
Automatically generated by python-semantic-release
"""

# Only consider commits that affect this package's path (monorepo filtering)
[tool.semantic_release.commit_parser_options]
path_filters = ["sqa-api/*"]

# Branch settings: define which branches do releases
[semantic_release.branches.main]
match = "main"
