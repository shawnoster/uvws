[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugin-one"
readme = "README.md"
description = "Plugin One Plugin"
maintainers = [{"name" = "fitness-function-maintainers"}]
keywords = ["sqa-developer-productivity"]
version = "0.4.2"
requires-python = ">=3.12"
dependencies = ["sqa-api"]

[project.entry-points."sqa.plugins"]
plugin-one = "plugin_one.plugin_one_plugin:PluginOnePlugin"

[tool.uv.sources]
sqa-api = { workspace = true }

[tool.semantic_release]
# Command to build the package (using uv for consistency)
build_command = "pip install uv && uv build -o dist"

# Git tag format for this package (ensures independent tags)
tag_format = "plugin-one-v{version}"

# Locations of the version string to update
version_toml = ["pyproject.toml:project.version"]
version_variables = ["plugin_one/__init__.py:__version__"]

# Customize the commit message that PSR uses when it commits the bump
commit_parser = "conventional"
commit_message = "chore(plugin-one-release): release plugin_one@{version} [skip ci]"
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]

# Only consider commits that affect this package's path (monorepo filtering)
[tool.semantic_release.commit_parser_options]
path_filters = ["plugins/plugin-one/plugin_one/**"]

# Branch settings: define which branches do releases
[semantic_release.branches.main]
match = "main"
